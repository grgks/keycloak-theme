<!DOCTYPE html>
<html class="login-pf" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomies Login Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Open Sans", Helvetica, Arial, sans-serif; font-size: 14px; min-height: 100vh; }
    </style>
    <link rel="stylesheet" href="roomies/login/resources/css/custom.css">
</head>
<body class="login-login">
<div class="login-pf-page">
    <div id="kc-header" class="login-pf-page-header">
        <div id="kc-header-wrapper">roomies</div>
    </div>
    <div class="card-pf" style="margin: 0 auto; max-width: 500px; padding: 20px 30px; border-top: 4px solid;">
        <h1 style="text-align: center; font-size: 20px; font-weight: 300; margin: 10px 0 25px; color: rebeccapurple">Sign in to your account</h1>
        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 13px; margin-bottom: 4px; font-weight: 700;">Email</label>
            <input type="text" style="width: 100%; padding: 8px 10px; border: 2px solid palegreen; border-radius: 4px; font-size: 14px;">
        </div>
        <div style="margin-bottom: 8px;">
            <label style="display: block; font-size: 13px; margin-bottom: 4px; font-weight: 700">Password</label>
            <input type="password" style="width: 100%; padding: 8px 10px; border: 2px solid palegreen; border-radius: 4px; font-size: 14px;">
        </div>
        <div style="text-align: right; margin-bottom: 16px;">
            <a class="login-pf-a" style="font-size: 13px; font-weight: 600; text-decoration: none;">Forgot Password?</a>
        </div>
        <button class="pf-c-button pf-m-primary" style="width: 100%; padding: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; color: white;">Sign In</button>
        <div style="text-align: center; margin-top: 16px; font-size: 13px; color: #72767b;">
            New user? <a class="login-pf-a" style="text-decoration: none; font-weight: 400;">Register</a>
        </div>
    </div>
</div>
</body>
</html>
